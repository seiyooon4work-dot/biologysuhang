  <style>

<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span><span class="brand-name">유전질환 탐구</span><span class="brand-sub">GENETIC CONDITIONS / 04 EXHIBITS</span></span></div>
        <nav class="disease-nav" role="tablist" aria-label="유전질환 선택"></nav>
      </div>
      <div class="reading-progress" aria-hidden="true"><span></span></div>
    </header>
    <main class="content" id="disease-panel" role="tabpanel" tabindex="0" aria-live="polite"></main>
  </div>
  <script>
    const conditions = [
      {
        id: "vhl", name: "폰히펠-린다우병", english: "Von Hippel-Lindau disease", gene: "VHL", kind: "여러 장기를 살피는 유전질환",
        accent: "#117a73",
        summary: "VHL 종양 억제 유전자의 변화로 눈, 뇌, 척수, 신장 등 여러 장기에 종양이나 낭종이 생길 위험이 높아지는 유전질환입니다.",
        facts: ["VHL", "상염색체 우성", "정기적 종양 감시"],
        heroPhoto: "assets/vhl-hero-medical.jpg", heroAlt: "뇌 MRI 검사 장면을 표현한 의학 교육용 이미지",
        clinicalSource: "https://commons.wikimedia.org/wiki/File:Hippel_angiogram.jpg",
        sections: [

          style="--tab-accent:${item.accent}">
          <span class="tab-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="tab-text"><span class="tab-name">${item.name}</span></span>
        </button>`).join("");
    }

    function showCondition(id, updateHash = true) {
      const item = conditions.find(condition => condition.id === id) || conditions[0];
      const itemIndex = conditions.indexOf(item);
      const next = conditions[(itemIndex + 1) % conditions.length];
      activeId = item.id;
      for (const tab of nav.querySelectorAll("[role=tab]")) {
        const selected = tab.dataset.id === item.id;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      }
      panel.setAttribute("aria-labelledby", `tab-${item.id}`);
      panel.style.setProperty("--accent", item.accent);
      document.querySelector(".reading-progress").style.setProperty("--progress-accent", item.accent);
      panel.innerHTML = `
        <header class="hero">
          <div class="hero-media"><img src="${item.heroPhoto}" alt="${item.heroAlt}" width="1672" height="941"></div>
          <div class="hero-shade" aria-hidden="true"></div>
          <div class="hero-inner">
            <div class="hero-topline"><span>GENETIC CONDITIONS / EXHIBIT ${String(itemIndex + 1).padStart(2, "0")}</span><span>FOUR CONDITIONS<br>ONE FIELD GUIDE</span></div>
            <div class="hero-copy">
              <div class="detail-kicker">${String(itemIndex + 1).padStart(2, "0")} / 04 · ${item.kind}</div>
              <h1>${item.name}</h1>
              <p class="english" lang="en">${item.english}</p>
              <p class="hero-summary">${item.summary}</p>
            </div>
            <div class="hero-bottomline"><span class="hero-count">${String(itemIndex + 1).padStart(2, "0")} / 04</span><a class="hero-scroll" href="#information">내용 살펴보기 <span class="scroll-arrow" aria-hidden="true">↓</span></a><span class="hero-count">유전질환 탐구</span></div>
          </div>
        </header>
        <p class="hero-caption">의학 교육용 생성 이미지이며 실제 환자의 검사 결과가 아닙니다. <a href="${item.clinicalSource}" target="_blank" rel="noopener noreferrer">실제 관련 검사 자료 보기</a></p>
        <div class="facts" aria-label="질환 핵심 정보">
          ${item.facts.map((value, index) => `<div class="fact"><span class="fact-label">${["관련 유전자", "유전 방식", "관리 초점"][index]}</span><span class="fact-value">${value}</span></div>`).join("")}
        </div>
        <div class="detail-body" id="information">
        <div class="chapter-intro reveal"><span class="chapter-label">FIELD NOTES / 01—05</span><h2>한 질환을 이해하는<br>다섯 가지 관점.</h2></div>
        <div class="section-list">
          ${item.sections.map(([label, description, points], index) => `
            <section class="info-section reveal" aria-labelledby="section-${item.id}-${index}">
              <h2 id="section-${item.id}-${index}"><span class="info-number">${String(index + 1).padStart(2, "0")}</span>${label}</h2>
              <div><p>${description}</p><ul>${points.map(point => `<li>${point}</li>`).join("")}</ul></div>
            </section>`).join("")}
        </div>
        <aside class="takeaway reveal"><span class="takeaway-label">기억할 점 / TAKEAWAY</span><p>${item.takeaway}</p></aside>
        <div class="sources"><span class="sources-label">근거 자료</span>${item.sources.map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${name} ↗</a>`).join("")}</div>
        <p class="disclaimer">학습용 요약입니다. 개인별 진단과 치료는 의료진과 상담해 결정해야 합니다.</p>
        <button class="next-exhibit" type="button" data-next="${next.id}" aria-label="다음 질환: ${next.name}"><span class="next-label">NEXT EXHIBIT / ${String((itemIndex + 1) % conditions.length + 1).padStart(2, "0")}</span><span class="next-name">${next.name}</span><span class="next-arrow" aria-hidden="true">↗</span></button>
        </div>`;
      if (revealObserver) revealObserver.disconnect();
      if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        revealObserver = new IntersectionObserver(entries => {
          for (const entry of entries) {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          }
        }, { threshold: .08, rootMargin: "0px 0px -32px 0px" });
        panel.querySelectorAll(".reveal").forEach(element => revealObserver.observe(element));
      } else {
        panel.querySelectorAll(".reveal").forEach(element => element.classList.add("is-visible"));
      }
      updateProgress();
      document.title = `${item.name} | 유전질환 탐구`;
      if (updateHash && location.hash !== `#${item.id}`) history.replaceState(null, "", `#${item.id}`);
    }

    nav.addEventListener("click", event => {
      const tab = event.target.closest("[role=tab]");
      if (tab) {
        showCondition(tab.dataset.id);
        window.scrollTo(0, 0);
      }
    });
    panel.addEventListener("click", event => {
      const scrollLink = event.target.closest(".hero-scroll");
      if (scrollLink) {
        event.preventDefault();
        panel.querySelector("#information").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
        return;
      }
      const nextButton = event.target.closest("[data-next]");
      if (!nextButton) return;
      showCondition(nextButton.dataset.next);
      window.scrollTo({ top: 0, behavior: "auto" });
      document.getElementById(`tab-${activeId}`).focus({ preventScroll: true });
    });
    function updateProgress() {
      const extent = document.documentElement.scrollHeight - window.innerHeight;
      const amount = extent > 0 ? Math.min(1, window.scrollY / extent) : 0;
      progress.style.transform = `scaleX(${amount})`;
    }
    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress);
    nav.addEventListener("keydown", event => {
      const keys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"];
      if (!keys.includes(event.key)) return;
      event.preventDefault();
      const current = conditions.findIndex(item => item.id === activeId);
      const next = event.key === "Home" ? 0 : event.key === "End" ? conditions.length - 1
        : (current + ((event.key === "ArrowRight" || event.key === "ArrowDown") ? 1 : -1) + conditions.length) % conditions.length;
      showCondition(conditions[next].id);
      document.getElementById(`tab-${conditions[next].id}`).focus();
      window.scrollTo(0, 0);
    });
    window.addEventListener("hashchange", () => {
      showCondition(location.hash.slice(1), false);
      window.scrollTo(0, 0);
    });
    buildNavigation();
    showCondition(location.hash.slice(1), false);
  </script>
</body>
</html>
